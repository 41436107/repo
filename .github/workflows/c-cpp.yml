name: Homework1 Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile C/C++ Code
      run: |
        cd homework1/src
        if [ -f Makefile ] || [ -f makefile ]; then
          make
        else
          g++ *.cpp -o program || gcc *.c -o program || echo "No source files found"
        fi
